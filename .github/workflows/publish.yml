name: Publish Stayzi social posts

# Runs every weekday at 09:30 IST (04:00 UTC). Anything in queue.json whose
# publish_at has passed, that is not yet published and not on hold, goes out.
on:
  schedule:
    - cron: "0 4 * * 1-5"
  workflow_dispatch:          # lets you fire it manually from the Actions tab

permissions:
  contents: write             # needed to commit the updated queue back

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish due posts
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GRAPH_VERSION: v26.0
        run: python tools/social/stayzi_publish.py

      - name: Commit updated queue
        run: |
          git config user.name  "stayzi-bot"
          git config user.email "bot@stayzi.in"
          git add tools/social/queue.json
          git diff --staged --quiet || git commit -m "social: mark published posts"
          git push
