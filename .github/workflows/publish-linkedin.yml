name: Publish Stayzi LinkedIn posts

# Runs Mon/Wed/Fri at 10:00 IST (04:30 UTC). Anything in linkedin_queue.json
# whose publish_at has passed, that is not yet published and not on hold,
# goes out. Deliberately a lighter cadence than the Meta workflow — LinkedIn
# punishes daily brand posting.
on:
  schedule:
    - cron: "30 4 * * 1,3,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would post, publish nothing"
        type: boolean
        default: false
      whoami_only:
        description: "Just print the person URN for the saved token, then stop"
        type: boolean
        default: false

permissions:
  contents: write             # needed to commit the updated queue back

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Prints the person URN without needing LINKEDIN_AUTHOR_URN to exist yet.
      # Run this once, right after saving the token, to get the URN to store.
      - name: Who am I
        if: ${{ inputs.whoami_only }}
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: python tools/social/stayzi_linkedin.py --whoami

      - name: Check credentials and queue
        if: ${{ !inputs.whoami_only }}
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN:   ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_CLIENT_ID:     ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_API_MODE: ${{ vars.LINKEDIN_API_MODE || 'ugc' }}
        run: python tools/social/stayzi_linkedin.py --check

      - name: Publish due posts
        if: ${{ !inputs.whoami_only }}
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN:   ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_API_MODE: ${{ vars.LINKEDIN_API_MODE || 'ugc' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python tools/social/stayzi_linkedin.py

      - name: Commit updated queue
        if: ${{ !inputs.whoami_only }}
        run: |
          git config user.name  "stayzi-bot"
          git config user.email "bot@stayzi.in"
          git add tools/social/linkedin_queue.json
          git diff --staged --quiet || git commit -m "linkedin: mark published posts"
          git push
